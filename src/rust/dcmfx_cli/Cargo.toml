[package]
name = "dcmfx_cli"
version = "0.49.0"
description = "DCMfx CLI tool"
categories = ["command-line-utilities"]

repository.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
keywords.workspace = true

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
async_zip = { version = "0.0.18", default-features = false, features = [
  "deflate",
  "tokio",
] }
aws-config = "1.10.1"
aws-credential-types = "1.3.0"
aws-sdk-sso = "1.105.0"
bytemuck = "1.25.2"
bytes = "1.12.1"
bytesize = "2.7.0"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
comfy-table = "8.0.0"
dcmfx = { path = "../dcmfx", default-features = false, features = [
  "async",
  "std",
] }
futures = "0.3.34"
glob = "0.3.4"
globset = "0.4.20"
image = { version = "0.25.10", default-features = false, features = [
  "jpeg",
  "png",
] }
num_cpus = "1.17.0"
object_store = { version = "0.14.1", default-features = false, features = [
  "aws",
  "azure",
  "fs",
  "gcp",
] }
owo-colors = "4.3.0"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "sync",
  "rt-multi-thread",
] }
tokio-util = { version = "0.7.19", features = ["io"] }
walkdir = "2.5.0"

[target.'cfg(not(windows))'.dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-ng"] }
libc = "0.2.189"

[dev-dependencies]
assert_cmd = "2.2.2"
async_zip = { version = "0.0.18", default-features = false, features = [
  "deflate",
  "tokio",
] }
insta = { version = "1.48.0", features = ["filters"] }
itertools = "0.15.0"
predicates = "3.1.4"
rand = "0.10.2"
tempfile = "3.27.0"

[features]
default = ["pixel_data_native"]
pixel_data_native = ["dcmfx/pixel_data_native"]
