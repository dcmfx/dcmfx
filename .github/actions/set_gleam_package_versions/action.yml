name: Set Gleam package versions

inputs:
  version:
    required: true

runs:
  using: composite
  steps:
    - name: Set Gleam package versions
      shell: bash
      run: |
        echo "Updating version in gleam.toml files …"
        find src/gleam -name "gleam.toml" -exec sed -i'' -E "s/^version = \".*\"$/version = \"${{ inputs.version }}\"/" {} +

        # All dcmfx_* dependencies are local path dependencies, so only their
        # version field in manifest.toml files needs updating. This is done
        # directly rather than with `gleam deps update` to avoid unnecessary
        # Hex API requests, which can hit rate limits.
        echo "Updating manifest.toml files …"
        sed -i'' -E "s/^(  \\{ name = \"dcmfx_[a-z0-9_]+\", version = \")[^\"]*(\".*source = \"local\".*)$/\\1${{ inputs.version }}\\2/" \
          src/gleam/*/manifest.toml examples/*/gleam/manifest.toml

        # Update the hardcoded version in uids.toml. In future perhaps Gleam
        # will have the ability to insert the package version at build time,
        # which would avoid needing to hardcode this.
        echo "Updating version in uids.gleam …"
        sed -i'' -E "s/\"DCMfx \" <> \".*\"$/\"DCMfx \" <> \"${{ inputs.version }}\"/" src/gleam/dcmfx_p10/src/dcmfx_p10/uids.gleam

